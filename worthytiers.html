<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORTHY TIERS | Official Rankings</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b090f;
            --surface: #16121e;
            --accent: #9d66ff;
            --accent-glow: rgba(157, 102, 255, 0.3);
            --text-main: #ffffff;
            --text-dim: #a196b6;
            --danger: #ff4d4d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text-main); line-height: 1.6; overflow-x: hidden; }

        /* Navigation */
        nav {
            background: var(--surface);
            padding: 1rem 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #2d263f;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-left { display: flex; align-items: center; gap: 20px; }
        .menu-trigger { font-size: 24px; cursor: pointer; color: var(--accent); transition: 0.3s; }
        .menu-trigger:hover { transform: scale(1.1); }
        .logo { font-weight: 900; font-size: 1.6rem; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; }
        .logo span { color: var(--accent); }

        /* Sidebar Drawer */
        #sidebar {
            position: fixed; left: -300px; top: 0; width: 280px; height: 100%;
            background: var(--surface); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 40px 20px; box-shadow: 10px 0 30px rgba(0,0,0,0.8); z-index: 1001;
        }
        #sidebar.active { left: 0; }
        .sidebar-link {
            display: block; color: var(--text-main); text-decoration: none; padding: 15px;
            border-radius: 8px; margin-bottom: 10px; font-weight: 600; cursor: pointer; transition: 0.3s;
        }
        .sidebar-link:hover { background: rgba(157, 102, 255, 0.1); color: var(--accent); }
        .sidebar-close { color: var(--danger); border: 1px solid var(--danger); text-align: center; margin-top: 50px; }

        /* Main Containers */
        .content-area { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .page-view { display: none; animation: fadeIn 0.4s ease; }
        .page-view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Search Bar */
        .search-container { margin-bottom: 30px; }
        .search-input {
            width: 100%; padding: 16px 25px; background: var(--surface);
            border: 2px solid #2d263f; border-radius: 50px; color: white;
            font-size: 1rem; transition: 0.3s;
        }
        .search-input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 20px var(--accent-glow); }

        /* Tier Cards */
        .player-card {
            background: var(--surface); border-radius: 12px; padding: 20px;
            margin-bottom: 15px; display: flex; align-items: center;
            border: 1px solid #2d263f; transition: 0.3s;
        }
        .player-card:hover { border-color: var(--accent); transform: scale(1.02); }
        .rank-tag { font-size: 2.2rem; font-weight: 900; color: var(--accent); width: 80px; font-style: italic; }
        .player-meta h3 { font-size: 1.4rem; margin-bottom: 5px; }
        .tier-badge {
            font-size: 0.75rem; font-weight: 800; color: var(--accent);
            background: rgba(157, 102, 255, 0.15); padding: 4px 12px; border-radius: 4px;
            text-transform: uppercase; display: inline-block;
        }

        /* Forms & Admin UI */
        .admin-card { background: var(--surface); padding: 30px; border-radius: 15px; border: 1px solid var(--accent); }
        h2 { margin-bottom: 20px; color: var(--accent); }
        input {
            width: 100%; padding: 12px; margin: 10px 0; background: #1f1a2b;
            border: 1px solid #3d3452; color: white; border-radius: 8px; outline: none;
        }
        .btn {
            width: 100%; padding: 14px; border: none; border-radius: 8px; cursor: pointer;
            font-weight: 800; text-transform: uppercase; transition: 0.3s; margin-top: 10px;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); margin-top: 30px; }
        .btn:hover { filter: brightness(1.2); }
        
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-left">
            <div class="menu-trigger" onclick="toggleSidebar()">☰</div>
            <div class="logo" onclick="showPage('home')">WORTHY<span>TIERS</span></div>
        </div>
    </nav>

    <div id="sidebar">
        <div class="sidebar-link" onclick="showPage('home')">🏠 Home Rankings</div>
        <div class="sidebar-link" onclick="showPage('login')">🔐 Admin Panel</div>
        <div class="sidebar-link sidebar-close" onclick="toggleSidebar()">CLOSE MENU</div>
    </div>

    <div class="content-area">
        
        <div id="page-home" class="page-view active">
            <div class="search-container">
                <input type="text" id="mainSearch" class="search-input" placeholder="Find a player or tier..." onkeyup="filterData()">
            </div>
            <div id="tierListContainer">
                </div>
        </div>

        <div id="page-login" class="page-view">
            <div class="admin-card">
                <h2>Admin Verification</h2>
                <input type="text" id="admUser" placeholder="Username">
                <input type="password" id="admPass" placeholder="Password">
                <button class="btn btn-primary" onclick="validateLogin()">Access Panel</button>
            </div>
        </div>

        <div id="page-admin" class="page-view">
            <div class="admin-card">
                <h2>Control Panel</h2>
                <div class="admin-grid">
                    <button class="btn btn-primary" onclick="openTool('add')">Add / Edit</button>
                    <button class="btn btn-primary" onclick="openTool('remove')">Remove</button>
                </div>

                <div id="tool-add" class="tool-box hidden">
                    <input type="text" id="inp-name" placeholder="Minecraft Username">
                    <input type="text" id="inp-tier" placeholder="Tier Status (e.g. S-Tier)">
                    <input type="number" id="inp-rank" placeholder="Rank Position (1-100)">
                    <button class="btn btn-primary" onclick="saveData()">Update Database</button>
                </div>

                <div id="tool-remove" class="tool-box hidden">
                    <input type="text" id="rem-name" placeholder="Username to Delete">
                    <button class="btn btn-danger" style="margin-top:0" onclick="deleteSingle()">Delete Player</button>
                </div>

                <button class="btn btn-danger" onclick="wipeAll()">Reset Entire Database</button>
            </div>
        </div>

    </div>

    <script>
        // Database Initialization
        let db = JSON.parse(localStorage.getItem('WORTHY_DB')) || [];

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        function showPage(pageId) {
            document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            if(pageId === 'home') renderHome();
            if(document.getElementById('sidebar').classList.contains('active')) toggleSidebar();
        }

        function validateLogin() {
            const u = document.getElementById('admUser').value;
            const p = document.getElementById('admPass').value;
            if(u === "MrCursedXD" && p === "09090909@") {
                showPage('admin');
            } else { alert("Invalid Credentials"); }
        }

        function openTool(tool) {
            document.querySelectorAll('.tool-box').forEach(t => t.classList.add('hidden'));
            document.getElementById('tool-' + tool).classList.remove('hidden');
        }

        // Logic: Save Data
        function saveData() {
            const name = document.getElementById('inp-name').value.trim();
            const tier = document.getElementById('inp-tier').value.trim();
            const rank = parseInt(document.getElementById('inp-rank').value);

            if(!name || !tier || !rank) return alert("Fill all fields");

            // Overwrite existing rank if it exists
            db = db.filter(p => p.rank !== rank);
            db.push({ name, tier, rank });
            db.sort((a,b) => a.rank - b.rank);
            
            localStorage.setItem('WORTHY_DB', JSON.stringify(db));
            alert("Database Updated!");
            
            document.getElementById('inp-name').value = '';
            document.getElementById('inp-tier').value = '';
            document.getElementById('inp-rank').value = '';
        }

        // Logic: Delete Single
        function deleteSingle() {
            const name = document.getElementById('rem-name').value.trim().toLowerCase();
            const originalLength = db.length;
            db = db.filter(p => p.name.toLowerCase() !== name);
            
            if(db.length < originalLength) {
                localStorage.setItem('WORTHY_DB', JSON.stringify(db));
                alert("Player Removed");
                document.getElementById('rem-name').value = '';
            } else {
                alert("Player not found");
            }
        }

        // Logic: Wipe All
        function wipeAll() {
            if(confirm("Wipe ALL data? This cannot be undone.")) {
                db = [];
                localStorage.removeItem('WORTHY_DB');
                renderHome();
                showPage('home');
            }
        }

        // Logic: Search / Filter
        function filterData() {
            const q = document.getElementById('mainSearch').value.toLowerCase();
            const filtered = db.filter(p => p.name.toLowerCase().includes(q) || p.tier.toLowerCase().includes(q));
            renderHome(filtered);
        }

        // Logic: Render Home
        function renderHome(data = db) {
            const container = document.getElementById('tierListContainer');
            container.innerHTML = '';
            
            if(data.length === 0) {
                container.innerHTML = '<div style="text-align:center; opacity:0.5; margin-top:50px;">No rankings available yet.</div>';
                return;
            }

            data.forEach(p => {
                container.innerHTML += `
                    <div class="player-card">
                        <div class="rank-tag">#${p.rank}</div>
                        <div class="player-meta">
                            <h3>${p.name}</h3>
                            <div class="tier-badge">${p.tier}</div>
                        </div>
                    </div>
                `;
            });
        }

        // Run on start
        renderHome();
    </script>
</body>
  </html>
